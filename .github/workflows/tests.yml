name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude scah-benches --exclude scah-cursor-benches -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude scah-benches --exclude scah-cursor-benches
      - name: Test cursor instrumentation
        run: cargo test -p scah --features bench-internals
      - name: Verify generated entity table and provenance
        run: |
          python3 crates/scah/scripts/generate_entities.py --self-test
          python3 -m unittest crates/scah/scripts/test_generate_entities.py
          python3 crates/scah/scripts/generate_entities.py
          git diff --exit-code -- crates/scah/src/html/entities_table.rs
      - name: Verify third-party license notices
        run: |
          test -f THIRD_PARTY_LICENSES/WHATWG-HTML.txt
          test -f crates/scah/THIRD_PARTY_LICENSES/WHATWG-HTML.txt
          cmp \
            THIRD_PARTY_LICENSES/WHATWG-HTML.txt \
            crates/scah/THIRD_PARTY_LICENSES/WHATWG-HTML.txt
          grep -F "THIRD_PARTY_LICENSES/WHATWG-HTML.txt" \
            crates/scah/src/html/entities_table.rs
      - name: Verify scah package contents
        run: |
          cargo package -p scah --list > /tmp/scah-package-files.txt
          cat /tmp/scah-package-files.txt

          grep -Fx "THIRD_PARTY_LICENSES/WHATWG-HTML.txt" \
            /tmp/scah-package-files.txt

          if grep -E '^scripts/' /tmp/scah-package-files.txt; then
            echo "Generator assets were included in the package"
            exit 1
          fi

          # --no-verify: package verification rebuilds against crates.io path-dep
          # versions; sibling workspace crates on this branch are not published yet.
          cargo package -p scah --no-verify
      - name: Check escape scanner benchmark
        run: cargo bench -p scah-benches --bench speed_bench_escape_scanner -- --test
      - name: Check cursor-dominance benchmark
        run: cargo bench -p scah-benches --bench speed_bench_cursor_dominance -- --test
      - name: Check text-extraction benchmark
        run: cargo bench -p scah-benches --bench speed_bench_text_extraction -- --test
      - name: Run cursor stats report
        run: cargo run -p scah-cursor-benches --release --bin cursor_stats_report

  node:
    name: Node Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: crates/bindings/scah-node
        run: bun install --frozen-lockfile

      - name: Build native binding
        working-directory: crates/bindings/scah-node
        run: bun run build:debug

      - name: Run Node tests
        working-directory: crates/bindings/scah-node
        run: bun test

  python:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test tooling
        run: |
          python -m pip install -U pip
          python -m pip install pytest

      - name: Build and install Python package
        working-directory: crates/bindings/scah-python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: crates/bindings/scah-python
        run: pytest tests/
