name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude scah-benches -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude scah-benches
      - name: Check escape scanner benchmark
        run: cargo bench -p scah-benches --bench speed_bench_escape_scanner -- --test
      - name: Smoke-test regression benchmarks
        run: cargo bench -p scah-regression-benches --bench core_regression -- --test
      - name: Compile instruction benchmarks (Linux, feature-gated)
        run: >
          cargo bench
          -p scah-regression-benches
          --bench instruction_counts
          --features linux-instruction-benches
          --no-run

      - name: Check benchmark comparison script syntax
        run: bash -n scripts/bench-compare.sh
      - name: Check Python helper syntax
        run: |
          python3 -m py_compile scripts/source-fingerprint.py
          python3 -m py_compile scripts/capture-untracked.py
          python3 -m py_compile scripts/copy-criterion-baseline.py
          python3 -m py_compile scripts/validate-criterion-comparison.py
          python3 -m py_compile scripts/tests/bench-compare-test.py

      - name: Test benchmark comparison workflow
        run: python3 scripts/tests/bench-compare-test.py

  benchmark-portability:
    name: Benchmark Package Portability
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check regression benchmark package
        run: >
          cargo check
          -p scah-regression-benches
          --all-targets
          --all-features

  python:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test tooling
        run: |
          python -m pip install -U pip
          python -m pip install pytest

      - name: Build and install Python package
        working-directory: crates/bindings/scah-python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: crates/bindings/scah-python
        run: pytest tests/
