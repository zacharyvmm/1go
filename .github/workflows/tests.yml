name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude scah-benches --exclude scah-cursor-benches -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude scah-benches --exclude scah-cursor-benches
      - name: Test optimized parser semantics
        run: cargo test --release -p scah
      - name: Test cursor instrumentation
        run: cargo test -p scah --features bench-internals
      - name: Test optimized implied-close preflight
        run: cargo test -p scah --release implied_close_preflight_matches_reactivated_attribute_cursor
      - name: Check escape scanner benchmark
        run: cargo bench -p scah-benches --bench speed_bench_escape_scanner -- --test
      - name: Check cursor-dominance benchmark
        run: cargo bench -p scah-benches --bench speed_bench_cursor_dominance -- --test
      - name: Check element-tape benchmark
        run: cargo bench -p scah-benches --bench speed_bench_element_tape -- --test
      - name: Check sibling benchmark
        run: cargo bench -p scah-benches --bench speed_bench_sibling -- --test
      - name: Run cursor stats report
        run: cargo run -p scah-cursor-benches --release --bin cursor_stats_report

  rust-aarch64:
    name: Rust AArch64 SIMD Checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test SIMD indexer in release mode
        run: "cargo test -p scah --release html::"
      - name: Check SIMD benchmark targets
        run: cargo bench -p scah-benches --bench speed_bench_element_tape -- --test

  python:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test tooling
        run: |
          python -m pip install -U pip
          python -m pip install pytest

      - name: Build and install Python package
        working-directory: crates/bindings/scah-python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: crates/bindings/scah-python
        run: pytest tests/
