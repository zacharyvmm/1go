name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude scah-benches --exclude scah-cursor-benches -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude scah-benches --exclude scah-cursor-benches
      - name: Check committed scah.h is current
        run: |
          cargo run -p scah-ffi --features header-gen --bin generate_header
          git diff --exit-code -- crates/scah-ffi/include/scah.h
      - name: C and C++ FFI smoke tests
        run: ./scripts/test-c-ffi.sh
      - name: Benchmark harness unit tests
        run: python3 scripts/test_bench_harness.py
      - name: Compile C ABI benchmark
        run: |
          cargo build -p scah-ffi --release
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps | python3 -c "import sys,json; print(json.load(sys.stdin)['target_directory'])")"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Icrates/scah-ffi/include \
            crates/scah-ffi/benches/c_abi_bench.c \
            -L"$TARGET_DIR/release" -lscah_ffi -lpthread -ldl -lm \
            -o /tmp/scah-c-abi-bench
          LD_LIBRARY_PATH="$TARGET_DIR/release" /tmp/scah-c-abi-bench --smoke > /tmp/scah-c-abi-smoke.json
          python3 -c "import json; d=json.load(open('/tmp/scah-c-abi-smoke.json')); assert d['results'], d"
      - name: Test cursor instrumentation
        run: cargo test -p scah --features bench-internals
      - name: Check escape scanner benchmark
        run: cargo bench -p scah-benches --bench speed_bench_escape_scanner -- --test
      - name: Check cursor-dominance benchmark
        run: cargo bench -p scah-benches --bench speed_bench_cursor_dominance -- --test
      - name: Run cursor stats report
        run: cargo run -p scah-cursor-benches --release --bin cursor_stats_report

  python:
    name: Python Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install test tooling
        run: |
          python -m pip install -U pip
          python -m pip install pytest

      - name: Build and install Python package
        working-directory: crates/bindings/scah-python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: crates/bindings/scah-python
        run: pytest tests/
      - name: Smoke result-access benchmark harness
        run: python3 scripts/bench-result-access.py --smoke --output /tmp/scah-python-bench-smoke.json

  node:
    name: Node Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install and build
        working-directory: crates/bindings/scah-node
        run: |
          bun install
          bun run build

      - name: Run Node tests
        working-directory: crates/bindings/scah-node
        run: bun test
      - name: Smoke result-access benchmark harness
        run: bun scripts/bench-result-access.ts --smoke --output /tmp/scah-node-bench-smoke.json
