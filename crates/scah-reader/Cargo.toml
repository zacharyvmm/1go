[package]
name = "scah-reader"
version = "0.0.20"
edition = "2024"
license = "MIT"
description = "Streaming XML and HTML reader primitives used by scah."
repository = "https://github.com/zacharyvmm/scah"
homepage = "https://github.com/zacharyvmm/scah"
documentation = "https://docs.rs/scah-reader"

[dependencies]
memchr = "2.7"

# SIMD support
[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86_64 SIMD intrinsics are in std::arch

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM NEON intrinsics are in std::arch

[lints.clippy]
let-and-return = "allow"
byte_char_slices = "allow"
redundant-field-names = "allow"
len_without_is_empty = "allow"
