[package]
name = "scah-python"
version = "0.0.18"
edition = "2024"

[lib]
name = "scah"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
scah-core = { package = "scah", path = "../../scah" }
pyo3 = { version = "0.27.2", features = ["abi3-py310"] }
pyo3-stub-gen = "0.22.1"
