# SPDX-License-Identifier: MIT
language = "C"
header = "/* scah C ABI — generated by cbindgen. Do not edit by hand. */"
include_guard = "SCAH_H"
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = false
documentation = true
documentation_style = "c99"
style = "both"
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
usize_is_size_t = true

[export]
include = [
    "ScahStatus",
    "ScahStringView",
    "ScahOptionalStringView",
    "ScahSave",
    "ScahQuerySectionId",
    "ScahQueryBuilder",
    "ScahQuery",
    "ScahStore",
    "ScahElement",
    "ScahElementList",
    "ScahError",
]

[fn]
sort_by = "None"

[enum]
prefix_with_name = true

[parse]
parse_deps = false
