[package]
name = "scah-ffi"
version = "0.0.21"
edition = "2024"
license = "MIT"
repository = "https://github.com/zacharyvmm/scah"
publish = false

[lib]
name = "scah_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
header-gen = ["dep:cbindgen"]

[[bin]]
name = "generate_header"
path = "src/bin/generate_header.rs"
required-features = ["header-gen"]

[dependencies]
scah = { path = "../scah" }
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
